apiVersion: v1
kind: Pod
metadata: 
  name: frontend-app
  labels: 
    app: frontend-app
spec:
  containers:
    - name: frontend-app
      image: supriyabarad/easy-frontend:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata: 
  name: frontend-svc
spec: 
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  selector:
    app: frontend-app
  type: LoadBalancer